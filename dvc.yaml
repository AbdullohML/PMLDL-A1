stages:
  process:
    cmd: python code/datasets/process_data.py
    deps:
      - code/datasets/process_data.py
      - data/raw/california_housing.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python code/models/train.py
    deps:
      - code/models/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - models/model.pkl

  deploy:
    cmd: sudo docker compose -f code/deployment/docker-compose.yml up -d --build
    deps:
      - models/model.pkl
      - code/deployment/api/main.py
      - code/deployment/api/Dockerfile
      - code/deployment/app/app.py
      - code/deployment/app/Dockerfile
      - code/deployment/docker-compose.yml
